/* ---------------- Hero ---------------- */
const Hero = {
  template: `
  <section id="top" class="pt-28 md:pt-36 pb-20 md:pb-28 bg-paper relative overflow-hidden">
    <canvas ref="canvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-[0.35]"></canvas>

          CRM・営業・マーケティング・AI活用まで。<br />
          御社の業務に合わせたHubSpot導入を、<br class="hidden md:inline" />

          <a href="#support" class="btn-ghost px-7 py-3.5 text-center text-[14px]">サービス内容を見る</a>
        </div>
      </div>
      <div class="md:col-span-5 fade-up">
        <div class="aspect-[4/5] bg-white border hairline relative overflow-hidden">
          <div class="absolute inset-0 p-8 flex flex-col justify-between">
            <div>
              <div class="flex items-center gap-2 text-[11px] tracking-[0.2em] text-gold font-bold">

                数据を活かしたAI活用まで。
              </p>

            <div class="border-t hairline pt-5 space-y-2 text-[12px] text-ink3">
              <div class="flex justify-between"><span>01</span><span>現状ヒアリング / 業務設計</span></div>
              <div class="flex justify-between"><span>02</span><span>HubSpot初期構築</span></div>
              <div class="flex justify-between"><span>03</span><span>運用・改善・AI活用</span></div>
            </div>
          </div>
          <div class="absolute top-0 right-0 w-32 h-32 bg-brand/5"></div>
          <div class="absolute bottom-0 left-0 w-20 h-20 bg-gold/10"></div>
        </div>
      </div>
    </div>
    <div class="relative max-w-[1200px] mx-auto px-5 md:px-8 mt-16 md:mt-20 border-t hairline pt-6">
      <ul class="flex flex-wrap gap-x-6 gap-y-2 text-[12px] md:text-[13px] text-ink3">
        <li>HubSpot導入</li>
        <li>CRM構築</li>
        <li>営業DX</li>
        <li>マーケティング自動化</li>
        <li>AI活用</li>
        <li>補助金活用相談</li>
      </ul>
    </div>
  </section>`,
  setup() {
    const canvas = ref(null);
    onMounted(() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const c = canvas.value; if (!c) return;
      const ctx = c.getContext('2d');
      let w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
      const resize = () => {
        w = c.clientWidth; h = c.clientHeight;
        c.width = w * dpr; c.height = h * dpr;
        ctx.scale(dpr, dpr);
      };
      resize();
      const nodes = Array.from({length: 22}, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
      }));
      let raf;
      const draw = () => {
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(33,53,69,0.08)';
        ctx.lineWidth = 1;
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          a.x += a.vx; a.y += a.vy;
          if (a.x < 0 || a.x > w) a.vx *= -1;
          if (a.y < 0 || a.y > h) a.vy *= -1;
          for (let j = i + 1; j < nodes.length; j++) {
            const b = nodes[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < 140) {
              ctx.globalAlpha = (1 - d / 140) * 0.5;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(33,53,69,0.35)';
        nodes.forEach(n => { ctx.fillRect(n.x - 1, n.y - 1, 2, 2); });
        raf = requestAnimationFrame(draw);
      };
      draw();
      window.addEventListener('resize', () => { resize(); });
    });
  }
};

        <div>
          <label class="block text-[13px] font-bold text-brand mb-2">
            {{label}}
            <span v-if="required" class="text-gold ml-1 text-[11px]">*必須</span>
          </label>
          <input :type="type||'text'" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)" class="input-field w-full px-4 py-3 text-[14px]" />
          <p v-if="error" class="mt-2 text-[12px] text-red-700">{{error}}</p>
        </div>`
    },
    'select-field': {
      props: ['label','modelValue','options'],
      emits: ['update:modelValue'],
      template: `
        <div>
          <label class="block text-[13px] font-bold text-brand mb-2">{{label}}</label>
          <select :value="modelValue" @change="$emit('update:modelValue', $event.target.value)" class="input-field w-full px-4 py-3 text-[14px] bg-white">
            <option value="">選択してください</option>
            <option v-for="o in options" :key="o" :value="o">{{o}}</option>
          </select>
        </div>`
    }
  },
  setup() {
    const form = reactive({
      company: '', name: '', email: '', tel: '',
      status: '', plan: '', subsidy: '',
      message: '', agree: false,
    });
    const errors = reactive({});
    const sending = ref(false);
    const sent = ref(false);
    const statusOpts = ['未導入','導入検討中','すでに利用中','他社からの乗り換え'];
    const planOpts = ['Starter','Professional','Enterprise','まだ決まっていない'];
    const subsidyOpts = ['検討している','相談したい','利用予定なし','わからない'];

    const validate = () => {
      Object.keys(errors).forEach(k => delete errors[k]);
      if (!form.company.trim()) errors.company = '会社名を入力してください。';
      if (!form.name.trim()) errors.name = 'お名前を入力してください。';
      if (!form.email.trim()) errors.email = 'メールアドレスを入力してください。';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) errors.email = 'メールアドレスの形式が正しくありません。';
      if (!form.message.trim()) errors.message = 'ご相談内容を入力してください。';
      if (!form.agree) errors.agree = '個人情報保護方針に同意してください。';
      return Object.keys(errors).length === 0;
    };
    const submit = async () => {
      if (!validate()) return;
      sending.value = true;
      await new Promise(r => setTimeout(r, 1200));
      sending.value = false;
      sent.value = true;
      window.scrollTo({ top: document.getElementById('contact').offsetTop - 80, behavior: 'smooth' });
    };
    return { form, errors, sending, sent, submit, statusOpts, planOpts, subsidyOpts };
  }
};

/* ---------------- Footer ---------------- */
const Footer = {
  template: `
  <footer class="bg-brand text-white/80">
    <div class="max-w-[1200px] mx-auto px-5 md:px-8 py-12 md:py-16 grid md:grid-cols-12 gap-8">
      <div class="md:col-span-5">
        <p class="text-white font-bold text-[15px]">HubSpot導入支援</p>
        <p class="text-[11px] tracking-[0.22em] text-gold mt-1 font-bold">IMPLEMENTATION SUPPORT</p>
        <p class="mt-5 text-[13px] leading-[2] max-w-sm">
          中小企業・小規模事業者のHubSpot導入・CRM設計・営業DX・AI活用までを伴走支援。
        </p>
      </div>
      <nav class="md:col-span-4 md:col-start-8 grid grid-cols-2 gap-y-3 text-[13px]">

        <a href="#pricing" class="hover:text-white">料金プラン</a>
        <a href="#process" class="hover:text-white">導入の流れ</a>
        <a href="#faq" class="hover:text-white">よくある質問</a>

        <a href="#" class="hover:text-white">会社情報</a>
      </nav>
    </div>
    <div class="border-t border-white/10">
      <div class="max-w-[1200px] mx-auto px-5 md:px-8 py-5 flex flex-col md:flex-row items-center justify-between gap-2 text-[11px] text-white/60">
        <span>© HubSpot導入支援</span>
        <span>HubSpotはHubSpot, Inc.の登録商標です。</span>
      </div>
    </div>
  </footer>`
};

/* ---------------- App ---------------- */
const App = {
  components: { Header, Hero, Problems, HubspotFlow, HubspotAiSubsidy, Features, SupportContents, Pricing, PricingTable, Process, Subsidy, SupportAfter, FAQ, CTA, ContactForm, Footer },
  template: `
    <Header />
    <main>
      <Hero />
      <Problems />
      <HubspotFlow />
      <HubspotAiSubsidy />
      <Features />
      <SupportContents />
      <Pricing />
      <PricingTable />
      <Process />
      <Subsidy />
      <SupportAfter />
      <FAQ />
      <CTA />
      <ContactForm />
    </main>
    <Footer />
  `,
  setup() {
    onMounted(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const els = document.querySelectorAll('.fade-up');
      if (reduced) {
        els.forEach(el => el.classList.add('is-visible'));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry, idx) => {
          if (entry.isIntersecting) {
            const el = entry.target;
            const delay = Math.min(idx * 40, 240);
            setTimeout(() => {
              if (typeof anime !== 'undefined') {
                anime({
                  targets: el,
                  opacity: [0, 1],
                  translateY: [18, 0],
                  duration: 700,
                  easing: 'easeOutQuad',
                });
              } else {
                el.classList.add('is-visible');
              }
            }, delay);
            io.unobserve(el);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      els.forEach(el => io.observe(el));
    });
  }
};

createApp(App).mount('#app');
</script>
